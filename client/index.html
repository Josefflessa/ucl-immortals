<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>UCL Immortals</title>
    <meta name="description" content="Monte o time dos sonhos com lendas da Champions League. Draft, química, táticas e simulação de partidas." />

    <!-- PWA: instalável + ícone na tela inicial -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0b14" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UCL Immortals" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Abertura: pinta antes do JS e do CSS do app, para não haver tela vazia enquanto o jogo baixa. -->
    <link rel="preload" as="image" href="/icons/logo_ucl.png" />
    <style>
      html, body { background: #0A0A12; margin: 0; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 40px; background: #0A0A12;
        transition: opacity .4s ease-out;
      }
      #splash.splash--out { opacity: 0; pointer-events: none; }
      #splash .splash__logo { position: relative; width: min(46vw, 200px); height: min(46vw, 200px); }
      #splash img { position: relative; width: 100%; height: 100%; object-fit: contain; animation: splash-in .6s ease-out both; }
      #splash .splash__bar { position: relative; width: min(58vw, 280px); height: 3px; overflow: hidden; border-radius: 3px; background: rgba(255, 255, 255, .09); }
      #splash .splash__bar::after {
        content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 3px;
        background: linear-gradient(90deg, transparent, #E9C46A, transparent);
        animation: splash-run 1.3s cubic-bezier(.45, 0, .55, 1) infinite;
      }
      @keyframes splash-run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes splash-in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { #splash img, #splash .splash__bar::after { animation: none; } #splash .splash__bar::after { width: 100%; opacity: .5; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Carregando">
      <div class="splash__logo"><img src="/icons/logo_ucl.png" alt="" width="200" height="200" decoding="async" /></div>
      <div class="splash__bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
